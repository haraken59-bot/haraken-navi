<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写真店舗検索・検証専用</title><link rel="stylesheet" href="./style.css"></head>
<body><main><h1>写真店舗検索・検証専用</h1><p><strong>検証用 Edge: navi-discover-photo-test</strong>（本番 navi-discover には送信しません）</p><p>読み取り専用です。店舗登録・食事履歴保存は行いません。写真のGPS位置を入力してください。</p>
<form id="test-search"><label>店名<input name="name" value="万徳" maxlength="60" required></label><label>写真の緯度<input name="latitude" type="number" step="any" min="-90" max="90" required></label><label>写真の経度<input name="longitude" type="number" step="any" min="-180" max="180" required></label><button type="submit">検証用Edgeで検索</button></form>
<p id="status" role="status"></p><pre id="results" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><p><a href="./index.html">通常のハラケンナビへ戻る</a></p></main><script type="module" src="./photo-store-test.js"></script></body></html>
