<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ハラケンナビ GPS検証</title><style>body{font-family:system-ui,sans-serif;max-width:650px;margin:0 auto;padding:20px;background:#f8fafc;color:#152336}h1{font-size:1.35rem}button{padding:12px 16px;background:#135d6c;color:white;border:0;border-radius:9px;font-size:1rem}button:disabled{opacity:.5}.card{background:white;border:1px solid #d8e1e8;border-radius:12px;padding:14px;margin:10px 0}.muted{color:#586779;font-size:.85rem}.status{font-weight:600}small{display:block;margin-top:8px}</style></head><body><h1>ハラケンナビ GPS表示テスト</h1><p>架空店舗だけの独立テストです。実際の店舗データは使いません。GPS座標は端末内だけで計算し、サーバーには送信しません。</p><button id="test">GPSを取得して表示</button> <button id="sample">GPSなしで試す</button><p id="state" role="status"></p><div id="results"></div><p class="muted">これはGPS取得・距離順表示・訪問状態表示の確認用です。ハラケンナビ本体の検索動作を保証するものではありません。</p><script>
const $=id=>document.getElementById(id);
const R=6371000;
const distance=(a,b)=>{const r=Math.PI/180,p=(b.lat-a.lat)*r,l=(b.lng-a.lng)*r;const h=Math.sin(p/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(l/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)))};
function render(center,source){const fixtures=[{name:'検証用・未訪問店',dlat:0,dlng:0,usage:'未訪問'},{name:'検証用・訪問1回店',dlat:.001,dlng:0,usage:'訪問済み'},{name:'検証用・訪問2回店',dlat:0,dlng:.001,usage:'再訪問'},{name:'検証用・範囲外店',dlat:.02,dlng:0,usage:'未訪問'}];const nearby=fixtures.map(f=>({...f,distance:distance(center,{lat:center.lat+f.dlat,lng:center.lng+f.dlng})})).filter(f=>f.distance<=500).sort((a,b)=>a.distance-b.distance);$('state').textContent=source+'：500m以内 '+nearby.length+'件（架空店舗）';$('results').replaceChildren(...nearby.map(f=>{const c=document.createElement('section');c.className='card';const t=document.createElement('strong');t.textContent=f.name;const m=document.createElement('small');m.textContent=f.usage+' ／ 約'+Math.round(f.distance)+'m';c.append(t,m);return c}));}
$('sample').onclick=()=>render({lat:33.583,lng:130.36},'サンプル座標');
$('test').onclick=()=>{if(!navigator.geolocation){$('state').textContent='この端末ではGPSが使えません';return}$('state').textContent='GPS取得中…';navigator.geolocation.getCurrentPosition(p=>render({lat:p.coords.latitude,lng:p.coords.longitude},'端末GPS'),e=>{$('state').textContent='GPS取得できません（コード '+e.code+'）。位置情報の許可をご確認ください。'}, {enableHighAccuracy:true,timeout:12000,maximumAge:0})};
</script></body></html>
