name: Known unvisited store tests
on:
  push:
    branches:
      - prep/known-stores-release-20261020
      - test/post-save-photo-store-link-20261020
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated known-store tests
        run: node --test tests/known-unvisited-stores.test.mjs tests/post-save-store-policy.test.mjs
