name: Recommendation regression tests
on:
  push:
    branches:
      - 'release/haraken-navi-integration-*'
  pull_request:
    paths:
      - '*.js'
      - 'genre-fit.js'
      - 'meal-client.js'
      - 'store-link-ui.js'
      - 'tests/**'
      - '.github/workflows/recommendation-tests.yml'
jobs:
  recommendation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test tests/*.test.mjs
