name: Recommendation regression tests
on:
  workflow_dispatch:
  push:
    branches:
      - fix/specific-food-preference-20261018
  pull_request:
    paths:
      - 'discovery.js'
      - 'photo-store-candidates.js'
      - 'importer/**'
      - 'domain.js'
      - 'genre-fit.js'
      - 'meal-client.js'
      - 'meal-photo.js'
      - 'store-link-ui.js'
      - 'tests/**'
      - '.github/workflows/recommendation-tests.yml'
jobs:
  recommendation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check domain.js
          node --check discovery.js
          node --check meal-client.js
          node --check store-link-ui.js
      - name: Specific dish unit tests
        run: node --experimental-default-type=module --test tests/specific-dish.test.mjs
      - name: Recommendation integration tests
        run: node --experimental-default-type=module --test tests/recommend-specific.test.mjs

      - name: Store linking name search tests
        run: node --experimental-default-type=module --test tests/store-link-search.test.mjs
      - name: Bottle merge tests
        if: always()
        run: node --experimental-default-type=module --test tests/bottle-merge.test.mjs
      - name: Store navigation tests
        if: always()
        run: node --experimental-default-type=module --test tests/store-navigation.test.mjs
      - name: Photo GPS pending tests
        if: always()
        run: node --experimental-default-type=module --test tests/photo-gps.test.mjs
      - name: Photo direction tests
        if: always()
        run: node --experimental-default-type=module --test tests/photo-direction.test.mjs
      - name: JPEG reference diagnostics tests
        if: always()
        run: node --experimental-default-type=module --test tests/jpeg-ref-diagnostics.test.mjs
      - name: JPEG reference hex tests
        if: always()
        run: node --experimental-default-type=module --test tests/jpeg-ref-hex.test.mjs
      - name: GPS offset audit tests
        if: always()
        run: node --experimental-default-type=module --test tests/gps-offset-audit.test.mjs
      - name: Photo store candidates tests
        if: always()
        run: node --experimental-default-type=module --test tests/photo-store-candidates.test.mjs
      - name: Discovery hint tests
        if: always()
        run: node --experimental-default-type=module --test tests/discovery-hint.test.mjs
      - name: NAVI-05 ranking tests
        if: always()
        run: node --experimental-default-type=module --test tests/navi05-ranking.test.mjs
      - name: W-B1 recommend tests
        if: always()
        run: node --experimental-default-type=module --test tests/wb1-recommend.test.mjs

