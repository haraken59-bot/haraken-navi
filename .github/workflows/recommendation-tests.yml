name: Recommendation regression tests
on:
  workflow_dispatch:
  push:
    branches:
      - fix/specific-food-preference-20261018
      - 'fix/meal-photo-safety-*'
      - 'fix/navi-six-followups-*'
  pull_request:
    paths:
      - 'domain.js'
      - 'genre-fit.js'
      - 'meal-client.js'
      - 'meal-photo.js'
      - 'meal-record.js'
      - 'meal-ui.js'
      - 'supabase/functions/**'
      - 'store-link-ui.js'
      - 'app/places.js'
      - 'tests/**'
      - '.github/workflows/recommendation-tests.yml'
jobs:
  recommendation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check domain.js
      - name: Meal photo safety tests
        run: node --experimental-default-type=module --test tests/meal-photo-safety.test.mjs
      - name: Read-only original photo audit tests
        run: node --experimental-default-type=module --test tests/meal-original-audit.test.mjs
      - name: Guest privacy regression test
        run: node --experimental-default-type=module --test tests/guest-privacy.test.mjs
      - name: Specific dish unit tests
        run: node --experimental-default-type=module --test tests/specific-dish.test.mjs
      - name: Recommendation integration tests
        run: node --experimental-default-type=module --test tests/recommend-specific.test.mjs

      - name: Store linking name search tests
        run: node --experimental-default-type=module --test tests/store-link-search.test.mjs

      - name: Photo store Edge and API integration tests
        run: |
          node --experimental-default-type=module --test tests/photo-store-lookup-policy.test.mjs tests/photo-store-edge-source.test.mjs tests/photo-store-adaptive.integration.test.mjs tests/edge-files-present.test.mjs tests/edge-imports.test.mjs tests/photo-store-parse-search.test.mjs tests/photo-store-service.integration.test.mjs
