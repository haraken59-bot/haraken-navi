name: Recommendation regression tests
on:
  push:
    branches:
      - fix/specific-food-preference-20261018
      - test/photo-store-policy-isolated-20261020
      - test/photo-search-ui-isolated-20261020
  pull_request:
    paths:
      - 'domain.js'
      - 'genre-fit.js'
      - 'meal-client.js'
      - 'store-link-ui.js'
      - 'tests/**'
      - '.github/workflows/recommendation-tests.yml'
jobs:
  recommendation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check domain.js
      - name: Specific dish unit tests
        run: node --experimental-default-type=module --test tests/specific-dish.test.mjs
      - name: Recommendation integration tests
        run: node --experimental-default-type=module --test tests/recommend-specific.test.mjs

      - name: Store linking name search tests
        run: node --experimental-default-type=module --test tests/store-link-search.test.mjs

      - name: Photo store candidate and post-save policy tests
        run: node --experimental-default-type=module --test tests/photo-store-candidates.test.mjs tests/post-save-store-policy.test.mjs

      - name: Check photo lookup client syntax
        run: node --experimental-default-type=module --check meal-client.js
